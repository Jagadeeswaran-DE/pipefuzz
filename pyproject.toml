[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "pipefuzz"
version = "0.1.0"
description = "Property-based testing for PySpark DataFrame transformations"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
keywords = ["pyspark", "hypothesis", "property-based-testing", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pyspark>=4.2,<4.3",
  "hypothesis>=6.158,<7",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.31,<2",
  "pytest>=9,<10",
]

[project.scripts]
pipefuzz = "pipefuzz.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/pipefuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
markers = [
  "integration: starts a real local SparkSession",
]
